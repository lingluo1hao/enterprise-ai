# /data/dify/nginx.conf
# =============================================================================
# Dify 反向代理（精简版，替代官方 docker/nginx/nginx.conf + proxy.conf + conf.d）
# =============================================================================
# 为什么必须要有这一层：
#   Dify 的 web(Next.js) 与 api(Flask) 是两个进程，而浏览器里所有请求都是
#   **相对路径**（/console/api、/api、/v1、/files）。没有同源反代，页面直接 404。
#
# 路由归属（对照 dify-api 的路由前缀，别乱加）：
#   /console/api  控制台 API      → api:5001
#   /api          前端/应用 API    → api:5001
#   /v1           服务端 API（本项目 dify_kb_server 之外，Dify 对外的那套）→ api:5001
#   /files        上传/下载文件    → api:5001
#   /e/           插件守护进程     → plugin_daemon:5002   ← 漏了这条，插件页面全 500
#   /             前端            → web:3000
#
# 两个实现细节，都是踩过坑才这么写的：
#   1) 上游地址放变量 + resolver 127.0.0.11：
#      nginx 启动时若上游没解析成功会直接退出（host not found in upstream），
#      容器编排里 api 比 nginx 慢几秒是常态。用变量强制运行时解析，避开这个。
#   2) /api 与 /v1 关掉 proxy_buffering：
#      Dify 的对话/工作流是 SSE 流式输出，开了缓冲会「憋住」直到整段生成完，
#      表现为前端一直转圈、最后一次性吐出全部内容。
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 关掉版本号泄露
    server_tokens off;

    # 上传大文件（知识库 PDF、图片）默认 1m 太小，会 413
    client_max_body_size 100m;
    client_body_buffer_size 1m;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # docker 内置 DNS：让下面的变量式 proxy_pass 能解析服务名
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ★★ 致命坑（2026-10-23 实测，血泪教训）：绝对不能把 Connection 硬编码成 "upgrade"。
    #   硬写 "upgrade" 时，普通 GET 请求（无 body）还能正常回，但**任何带 body 的 POST**
    #   都会被 gunicorn 的 GeventWebSocketWorker 当成协议升级握手晾着：既不读请求体、
    #   也不返回响应，一直挂到超时。
    #   实测对照（同一台机器、同一时刻）：
    #     直接打 gunicorn 5001：POST /console/api/login → 401，耗时 0.0055s
    #     经 nginx 8080      ：POST /console/api/login → 200 秒 0 字节，超时
    #     经 nginx 8080      ：GET  /console/api/setup  → 200，耗时 0.006s（无 body 所以没事）
    #     POST /console/api/refresh-token（空 body）   → 401，耗时 0.002s（无 body 所以没事）
    #   表现为「点设置转圈」「点登录转圈」，而所有 GET 接口都是毫秒级，极难联想。
    #   正确写法就是官方这套 map：只有真带 Upgrade 头的请求才发 upgrade。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # 健康检查（compose healthcheck 打的就是这里）
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # ---------- 控制台 API ----------
        location /console/api/ {
            set $upstream_api http://api:5001;
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---------- 前端/应用 API（含 SSE 流式对话）----------
        location /api/ {
            set $upstream_api http://api:5001;
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            # SSE 三件套：不缓冲、不缓存、长超时
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---------- 服务端 API（给外部程序调）----------
        location /v1/ {
            set $upstream_api http://api:5001;
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---------- 文件上传/下载 ----------
        location /files/ {
            set $upstream_api http://api:5001;
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # ---------- 插件守护进程 ----------
        # 注意：proxy_pass 后面**不带** URI，要保留 /e/ 前缀原样转发
        location /e/ {
            set $upstream_plugin http://plugin_daemon:5002;
            proxy_pass $upstream_plugin;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---------- 前端（放在最后，前缀最短，最长前缀优先匹配前面几条）----------
        location / {
            set $upstream_web http://web:3000;
            proxy_pass $upstream_web;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
        }
    }
}
