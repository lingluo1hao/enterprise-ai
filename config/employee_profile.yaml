# =====================================================================
# 岗位档案（employee_profiles）—— 数字员工「身份」要素（P0.5 配置文件版）
# =====================================================================
# 设计说明（docs/guides/digital_employee_plan.md §5 要素 1 / §8 P0.5）：
#   数字员工先得是一个「岗位」：JD + 职责边界 + 工具白名单 + 验收阈值，
#   而不是一个权限位（admin/user）。
#   P0.5 用配置文件；P1 迁移为 employee_profiles 表（多租户）。
#
# 字段说明：
#   mission          岗位使命（一句话，进系统提示）
#   responsibilities 职责清单（JD）
#   tool_allowlist   工具白名单——岗位能调的工具，超出即越权（P2 接 validate）
#   review           验收门阈值（仅走 RAG 问答的岗位用；巡检岗不适用）
#     min_hits         独立复核检索的最少命中数（0 = 查空 → rejected）
#     max_distance     最优命中的距离上限（Milvus COSINE 距离，越小越相关）
#     min_answer_chars 答案长度下限（过短 → rejected）
#     reject_phrases   查空/道歉措辞——出现在答案开头视为 rejected，其余位置降级
#   shift           班次配置（巡检岗用）
#     source_status    巡检捞取的 bad case 状态
#     max_cases        单班次处理上限（防失控——安全边界要素的最小形态）
#     high_confidence  进入人工复审清单的置信度档位
#     report_dir       日报落盘目录
# =====================================================================

employees:
  # ------------------------------------------------------------------
  # 资料研究员：P0 骨架的回归岗位（原「查资料并总结」场景，不再是主场景）
  # ------------------------------------------------------------------
  researcher:
    name: 资料研究员
    version: 1
    mission: 给定目标，检索知识库并产出有依据的总结；查不到资料必须明说，不得编造。
    responsibilities:
      - 把目标拆解为可检索的子问题
      - 只依据检索到的资料作答
      - 检索为空或低相关时明确报告「查不到」，不硬合成答案
    tool_allowlist:
      - doc_search
      - calculator
    review:
      min_hits: 1
      max_distance: 0.75
      min_answer_chars: 30
      reject_phrases: [未找到, 没有找到, 未检索到, 没有相关, 无法回答, 抱歉, 查不到]

  # ------------------------------------------------------------------
  # 知识库运营专员：第一岗位（v2 改选题后的主场景）
  # ------------------------------------------------------------------
  kb_ops:
    name: 知识库运营专员
    version: 1
    mission: 巡检 bad_cases，自动诊断归因，产出运营日报与人工复审清单；不自动修改任何数据。
    responsibilities:
      - 巡检 bad_cases 未处理条目（P0.5 手动触发，P1 接 APScheduler 定时）
      - 逐条跑 agentworkflow 诊断流水线，产出根因结论
      - 高置信 case 整理为人工复审清单（waiting 思路：只标记，不自动应用修复）
      - 产出当日运营日报并落盘
    tool_allowlist:
      - doc_search
      - calculator
      - diagnose_bad_case
      - write_report
    review: {}                # 巡检岗不走 RAG 验收门（诊断流水线自带置信度）
    shift:
      source_status: open     # 诊断回写后 open → in_progress（agentworkflow 既有行为）
      max_cases: 20
      high_confidence: [高, 中高]
      report_dir: logs/shift_reports

  # ------------------------------------------------------------------
  # 工厂业务五岗位（对应 biz_roles 业务角色 + MCP 工具集）
  # 工具白名单与 access_rules.yaml order_acl 的 resources/ops 对齐；
  # 高危动作经 approval.ApprovalGate 自动挂起等人工审批。
  # ------------------------------------------------------------------
  sales_rep:
    name: 销售跟单员
    version: 1
    biz_role: sales_user
    mission: 受理客户订单：报价查询 → 建单 → 确认（信用/库存校验）→ 跟出库与物流。
    responsibilities:
      - 查产品价格与可售性
      - 创建/确认销售订单（防超卖占用在确认时生效）
      - 跟进出库单、物流与签收
    tool_allowlist:
      - doc_search
      - list_products
      - create_sales_order
      - confirm_sales_order
      - query_sales_orders
      - create_delivery
      - ship_delivery
    high_risk_actions: [sales_order.complete, sales_order.cancel]
    review: {}

  repair_dispatcher:
    name: 维修调度员
    version: 1
    biz_role: dept_manager
    mission: 受理设备报修：建单（台账联动保内外/关键度）→ 故障归类 → 派单 → 跟进完工审批与验证。
    responsibilities:
      - 创建维修工单（A 类设备自动升 urgent）
      - 故障归类到标准故障代码（联动 SOP 检索）
      - 按技能提示派单
      - 触发到期保养计划生成工单
    tool_allowlist:
      - doc_search
      - create_repair_order
      - classify_fault
      - assign_technician
      - query_repair_orders
      - trigger_due_pm
    high_risk_actions: [repair_order.cancel]
    review: {}

  repair_engineer:
    name: 维修工程师
    version: 1
    biz_role: repair_user
    mission: 接单维修：检索维修 SOP → 领料备件 → 完工提交（审批后关单）。
    responsibilities:
      - 按 RAG 检索故障 SOP 与设备手册（复用现有知识库）
      - 维修领料（扣库存记流水）
      - 提交完工结论与停机时长（高危，走审批）
    tool_allowlist:
      - doc_search
      - start_repair
      - use_repair_parts
      - submit_resolution
      - query_repair_orders
    high_risk_actions: [repair_order.resolve]
    review: {}

  warehouse_keeper:
    name: 库管员
    version: 1
    biz_role: warehouse_user
    mission: 仓储执行：出库放行（审批后扣库存）、物流交接、库存与流水查询。
    responsibilities:
      - 申请放行出库单（高危，审批后执行）
      - 发运交接承运商
      - 库存水位与流水审计
    tool_allowlist:
      - query_inventory
      - query_stock_transactions
      - request_release_delivery
      - ship_delivery
    high_risk_actions: [sales_delivery.release, inventory.adjust]
    review: {}

  buyer:
    name: 采购员
    version: 1
    biz_role: purchase_user
    mission: 补货采购：低库存识别 → 建采购单 → 提交审批（>10 万须超管级）→ 跟收货入库。
    responsibilities:
      - 查低库存预警（安全库存线）
      - 创建/提交采购单
      - 跟进收货入库回写
    tool_allowlist:
      - query_inventory
      - list_products
      - create_purchase_order
      - submit_purchase_order
    high_risk_actions: [purchase_order.approve]
    review: {}
