<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" font-family="Microsoft YaHei">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6E8DBF"/>
    </marker>
  </defs>
  <rect width="860" height="500" fill="#0E1726"/>
  <text x="40" y="44" fill="#E8F0FF" font-size="24" font-weight="bold">量化方法：如何测量「被埋」</text>
  <text x="40" y="72" fill="#8FA6C4" font-size="14">scripts/eval_retrieval_bury.py — 直连真实 Milvus + Ollama bge-m3，复刻检索链路</text>

  <!-- stage 1 -->
  <rect x="40" y="110" width="180" height="120" rx="10" fill="#16263D" stroke="#3E6FB0" stroke-width="1.5"/>
  <text x="130" y="138" fill="#5AA9FF" font-size="14" font-weight="bold" text-anchor="middle">① 输入</text>
  <text x="130" y="164" fill="#D6E2F2" font-size="13" text-anchor="middle">真实日志 query</text>
  <text x="130" y="190" fill="#FF9F45" font-size="12" text-anchor="middle">基站信息格式</text>
  <text x="130" y="208" fill="#FF9F45" font-size="12" text-anchor="middle">基站信息格式是什么</text>
  <text x="130" y="226" fill="#FF9F45" font-size="12" text-anchor="middle">VI 基站信息格式</text>

  <!-- stage 2 -->
  <rect x="250" y="110" width="190" height="120" rx="10" fill="#16263D" stroke="#3E6FB0" stroke-width="1.5"/>
  <text x="345" y="138" fill="#5AA9FF" font-size="14" font-weight="bold" text-anchor="middle">② 召回</text>
  <text x="345" y="164" fill="#D6E2F2" font-size="12" text-anchor="middle">原句 + LLM 改写(3)</text>
  <text x="345" y="186" fill="#7E93B0" font-size="11" text-anchor="middle">每个 query 各自走</text>
  <text x="345" y="204" fill="#7E93B0" font-size="11" text-anchor="middle">Milvus hybrid+RRF</text>
  <text x="345" y="224" fill="#7E93B0" font-size="11" text-anchor="middle">返回 top-k 文档</text>

  <!-- stage 3 -->
  <rect x="470" y="110" width="180" height="120" rx="10" fill="#16263D" stroke="#3E6FB0" stroke-width="1.5"/>
  <text x="560" y="138" fill="#5AA9FF" font-size="14" font-weight="bold" text-anchor="middle">③ 合并策略</text>
  <text x="560" y="166" fill="#FF5C7A" font-size="12" text-anchor="middle">CURRENT 末尾+锁分</text>
  <text x="560" y="188" fill="#7FD98A" font-size="12" text-anchor="middle">FIXED-A 置顶+最佳分</text>
  <text x="560" y="210" fill="#7FD98A" font-size="12" text-anchor="middle">RRF 跨 query 融合</text>

  <!-- stage 4 -->
  <rect x="680" y="110" width="140" height="120" rx="10" fill="#16263D" stroke="#3E6FB0" stroke-width="1.5"/>
  <text x="750" y="138" fill="#5AA9FF" font-size="14" font-weight="bold" text-anchor="middle">④ 指标</text>
  <text x="750" y="166" fill="#D6E2F2" font-size="12" text-anchor="middle">gold 排名</text>
  <text x="750" y="190" fill="#D6E2F2" font-size="12" text-anchor="middle">是否 &gt; top5</text>
  <text x="750" y="212" fill="#FF9F45" font-size="11" text-anchor="middle">被埋判定</text>

  <!-- arrows -->
  <line x1="220" y1="170" x2="246" y2="170" stroke="#6E8DBF" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="440" y1="170" x2="466" y2="170" stroke="#6E8DBF" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="650" y1="170" x2="676" y2="170" stroke="#6E8DBF" stroke-width="2" marker-end="url(#arw)"/>

  <!-- gold definition box -->
  <rect x="40" y="262" width="780" height="86" rx="10" fill="#13233A" stroke="#2E4A6E" stroke-width="1"/>
  <text x="60" y="290" fill="#D6E2F2" font-size="14" font-weight="bold">判定基准 gold：</text>
  <text x="60" y="312" fill="#D6E2F2" font-size="13">「原句单独检索的 top-1 文档」= 用户最想要的精准答案。若它在合并结果中落到 top-5 之外，即判定为<tspan fill="#FF5C7A" font-weight="bold">被埋</tspan>。</text>
  <text x="60" y="334" fill="#8FA6C4" font-size="12">三种策略用<tspan fill="#FF9F45">完全相同的 recall 输入</tspan>，只改变「合并」这一步 —— 公平对比合并算法对精准命中的影响。</text>

  <!-- verdict -->
  <rect x="40" y="368" width="780" height="100" rx="10" fill="#13233A" stroke="#2E4A6E" stroke-width="1"/>
  <text x="60" y="396" fill="#D6E2F2" font-size="14" font-weight="bold">量化结论（见 5.4「量化评估结果」小节）：</text>
  <text x="60" y="420" fill="#D6E2F2" font-size="13">3 个 query 中 <tspan fill="#FF5C7A" font-weight="bold">1 个被埋</tspan>（最高频的「基站信息格式」，即日志被答非所问那条）；</text>
  <text x="60" y="442" fill="#D6E2F2" font-size="13">FIXED-A / RRF 都能把它救回 top-1，<tspan fill="#7FD98A" font-weight="bold">被埋率 1/3 → 0</tspan>。</text>
  <text x="60" y="464" fill="#8FA6C4" font-size="12">reranker 实测另计（5.5「reranker 实证」）：相关 +3.07 / 无关 -6.77，精排方向正确。</text>
</svg>
