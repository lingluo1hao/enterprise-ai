<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="Microsoft YaHei">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF9F45"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5AA9FF"/>
    </marker>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2B42"/>
      <stop offset="100%" stop-color="#1A2438"/>
    </linearGradient>
  </defs>

  <rect width="900" height="540" fill="#0E1726"/>
  <rect x="0" y="0" width="900" height="3" fill="#5AA9FF" opacity="0.5"/>

  <text x="450" y="44" fill="#E8F0FF" font-size="22" font-weight="bold" text-anchor="middle">为什么 dense 单路不够：bi-encoder 的三大先天缺陷</text>
  <text x="450" y="68" fill="#7E93B0" font-size="12" text-anchor="middle" font-style="italic">Three Latent Defects of the Dense-Only Bi-Encoder Retrieval Pipeline</text>

  <!-- ============ CARD 1: 语义 gap ============ -->
  <g transform="translate(30,100)">
    <rect width="270" height="400" rx="10" fill="url(#cardG)" stroke="#2E4A6E" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="6" rx="3" fill="#FF6B6B"/>

    <circle cx="38" cy="50" r="22" fill="#FF6B6B" opacity="0.18"/>
    <circle cx="38" cy="50" r="22" fill="none" stroke="#FF6B6B" stroke-width="1.5"/>
    <text x="38" y="58" fill="#FF6B6B" font-size="22" font-weight="bold" text-anchor="middle">1</text>
    <text x="78" y="48" fill="#E8F0FF" font-size="20" font-weight="bold">语义 gap</text>
    <text x="78" y="68" fill="#7E93B0" font-size="11">Semantic Gap</text>

    <g transform="translate(30,100)">
      <text x="105" y="10" fill="#B8C8DD" font-size="11" text-anchor="middle">bi-encoder 各自独立编码</text>

      <rect x="0"   y="22" width="70"  height="14" rx="3" fill="#5AA9FF"/>
      <text x="35"  y="32" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">短关键词</text>
      <text x="35"  y="50" fill="#7FD98A" font-size="11" text-anchor="middle" font-weight="bold">dist = 0.15</text>

      <rect x="0"   y="68" width="160" height="14" rx="3" fill="#5AA9FF" opacity="0.5"/>
      <text x="80"  y="78" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">长问句</text>
      <text x="80"  y="96" fill="#FF9F45" font-size="11" text-anchor="middle" font-weight="bold">dist = 0.45  ≈ 3×</text>

      <line x1="0" y1="115" x2="210" y2="115" stroke="#2E4A6E" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="105" y="130" fill="#7E93B0" font-size="10" text-anchor="middle">向量长度只是示意 — 真实差距是语义</text>
    </g>

    <text x="20" y="260" fill="#D6E2F2" font-size="13" font-weight="bold">query 与 doc 各自成向量再算距离</text>
    <text x="20" y="284" fill="#B8C8DD" font-size="12">短关键词向量准，长问句向量易</text>
    <text x="20" y="304" fill="#FF9F45" font-size="12">「语义漂移」 → 召回失真</text>

    <rect x="20" y="322" width="230" height="60" rx="6" fill="#0E1726" stroke="#2E4A6E"/>
    <text x="32" y="342" fill="#FF9F45" font-size="11" font-weight="bold">▎ 实测</text>
    <text x="32" y="362" fill="#E8F0FF" font-size="12">长问句距离是短关键词的</text>
    <text x="32" y="378" fill="#7FD98A" font-size="13" font-weight="bold">约 3 倍</text>
  </g>

  <!-- ============ CARD 2: 分数不可比 ============ -->
  <g transform="translate(315,100)">
    <rect width="270" height="400" rx="10" fill="url(#cardG)" stroke="#2E4A6E" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="6" rx="3" fill="#FF6B6B"/>

    <circle cx="38" cy="50" r="22" fill="#FF6B6B" opacity="0.18"/>
    <circle cx="38" cy="50" r="22" fill="none" stroke="#FF6B6B" stroke-width="1.5"/>
    <text x="38" y="58" fill="#FF6B6B" font-size="22" font-weight="bold" text-anchor="middle">2</text>
    <text x="78" y="48" fill="#E8F0FF" font-size="20" font-weight="bold">分数不可比</text>
    <text x="78" y="68" fill="#7E93B0" font-size="11">Incomparable Scores</text>

    <g transform="translate(20,100)">
      <text x="115" y="10" fill="#B8C8DD" font-size="11" text-anchor="middle">两个不同 query 的距离分布</text>

      <!-- query A: 0.3-0.6 -->
      <rect x="60"  y="22" width="115" height="16" rx="3" fill="#5AA9FF" opacity="0.55"/>
      <text x="0"   y="34" fill="#5AA9FF" font-size="11" font-weight="bold">A</text>
      <text x="172" y="34" fill="#5AA9FF" font-size="10" text-anchor="end">0.6</text>
      <text x="60"  y="52" fill="#5AA9FF" font-size="10">基站信息格式   0.30 → 0.60</text>

      <!-- query B: 0.1-0.4 -->
      <rect x="20"  y="68" width="115" height="16" rx="3" fill="#FF9F45" opacity="0.55"/>
      <text x="0"   y="80" fill="#FF9F45" font-size="11" font-weight="bold">B</text>
      <text x="132" y="80" fill="#FF9F45" font-size="10" text-anchor="end">0.4</text>
      <text x="20"  y="98" fill="#FF9F45" font-size="10">VI 基站 ...   0.10 → 0.40</text>

      <!-- overlap highlight -->
      <rect x="60" y="22" width="55" height="16" rx="3" fill="#FF6B6B" opacity="0.45"/>
      <text x="87" y="120" fill="#FF6B6B" font-size="10" text-anchor="middle" font-weight="bold">▲ 重叠区间</text>
      <text x="87" y="134" fill="#7E93B0" font-size="10" text-anchor="middle">0.30-0.40</text>
    </g>

    <text x="20" y="260" fill="#D6E2F2" font-size="13" font-weight="bold">不同 query 距离分布不同</text>
    <text x="20" y="284" fill="#B8C8DD" font-size="12">B 的 0.4 比 A 的 0.3 大，</text>
    <text x="20" y="304" fill="#FF9F45" font-size="12">但 B 其实更相关 → sort by score 错排</text>

    <rect x="20" y="322" width="230" height="60" rx="6" fill="#0E1726" stroke="#2E4A6E"/>
    <text x="32" y="342" fill="#FF9F45" font-size="11" font-weight="bold">▎ 结果</text>
    <text x="32" y="362" fill="#E8F0FF" font-size="12">A 的 gold 文档被挤到</text>
    <text x="32" y="378" fill="#7FD98A" font-size="13" font-weight="bold">rank 9</text>
  </g>

  <!-- ============ CARD 3: 改写副作用 ============ -->
  <g transform="translate(600,100)">
    <rect width="270" height="400" rx="10" fill="url(#cardG)" stroke="#2E4A6E" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="6" rx="3" fill="#FF6B6B"/>

    <circle cx="38" cy="50" r="22" fill="#FF6B6B" opacity="0.18"/>
    <circle cx="38" cy="50" r="22" fill="none" stroke="#FF6B6B" stroke-width="1.5"/>
    <text x="38" y="58" fill="#FF6B6B" font-size="22" font-weight="bold" text-anchor="middle">3</text>
    <text x="78" y="48" fill="#E8F0FF" font-size="20" font-weight="bold">改写副作用</text>
    <text x="78" y="68" fill="#7E93B0" font-size="11">Rewrite Side Effect</text>

    <g transform="translate(30,98)">
      <text x="105" y="10" fill="#B8C8DD" font-size="11" text-anchor="middle">append 到列表末尾</text>

      <!-- 改写 1 改写 2 (top) -->
      <rect x="0"   y="22" width="78" height="22" rx="4" fill="#FF9F45"/>
      <text x="39"  y="37" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">改写 1</text>
      <rect x="132" y="22" width="78" height="22" rx="4" fill="#FF9F45"/>
      <text x="171" y="37" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">改写 2</text>

      <!-- 原句 box (middle) - the "most accurate" signal -->
      <rect x="40"  y="56" width="130" height="26" rx="4" fill="#5AA9FF"/>
      <text x="105" y="73" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">原句 = 最准信号</text>

      <!-- arrow from 原句 down to bottom -->
      <path d="M105,82 C105,95 105,108 105,118" fill="none" stroke="#5AA9FF" stroke-width="2" marker-end="url(#ar2)"/>

      <!-- bottom 末尾 -->
      <rect x="40" y="120" width="130" height="22" rx="4" fill="#241820" stroke="#5A3340" stroke-width="1.5"/>
      <text x="105" y="135" fill="#FF6B6B" font-size="11" font-weight="bold" text-anchor="middle">▼ 列表末尾</text>
    </g>

    <text x="20" y="260" fill="#D6E2F2" font-size="13" font-weight="bold">LLM 改写扩大召回</text>
    <text x="20" y="284" fill="#B8C8DD" font-size="12">却把"原句 = 最准信号"</text>
    <text x="20" y="304" fill="#FF9F45" font-size="12">压到尾部 → 首分被改写锁死</text>

    <rect x="20" y="322" width="230" height="60" rx="6" fill="#0E1726" stroke="#2E4A6E"/>
    <text x="32" y="342" fill="#FF9F45" font-size="11" font-weight="bold">▎ 日志实证</text>
    <text x="32" y="362" fill="#E8F0FF" font-size="12">最高频 query「基站信息格式」</text>
    <text x="32" y="378" fill="#7FD98A" font-size="13" font-weight="bold">沉到 rank 9</text>
  </g>

  <text x="450" y="525" fill="#7E93B0" font-size="12" text-anchor="middle">三缺陷叠加 → 必须用 RRF 跨 query 融合 + cross-encoder 精排才能根治（见下一节）</text>
</svg>