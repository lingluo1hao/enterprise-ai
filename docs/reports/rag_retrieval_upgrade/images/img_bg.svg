<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="Microsoft YaHei">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6E8DBF"/>
    </marker>
  </defs>
  <rect width="800" height="460" fill="#0E1726"/>
  <text x="40" y="44" fill="#E8F0FF" font-size="24" font-weight="bold">背景：精确原句被埋的检索链路</text>
  <text x="40" y="72" fill="#8FA6C4" font-size="14">langgraph_rag_agent.py — 多 query 召回后朴素合并，原句信号被稀释</text>

  <!-- box1 -->
  <rect x="40" y="110" width="200" height="66" rx="10" fill="#16263D" stroke="#3E6FB0" stroke-width="1.5"/>
  <text x="140" y="138" fill="#D6E2F2" font-size="15" text-anchor="middle">用户原句</text>
  <text x="140" y="162" fill="#5AA9FF" font-size="15" text-anchor="middle" font-weight="bold">基站信息格式</text>

  <!-- box2 -->
  <rect x="290" y="104" width="230" height="78" rx="10" fill="#16263D" stroke="#3E6FB0" stroke-width="1.5"/>
  <text x="405" y="130" fill="#D6E2F2" font-size="14" text-anchor="middle">query_rewrite</text>
  <text x="405" y="152" fill="#FF9F45" font-size="13" text-anchor="middle">原句 append 到列表末尾</text>
  <text x="405" y="172" fill="#7E93B0" font-size="12" text-anchor="middle">queries.append(query)</text>

  <!-- box3 -->
  <rect x="560" y="98" width="200" height="92" rx="10" fill="#16263D" stroke="#3E6FB0" stroke-width="1.5"/>
  <text x="660" y="124" fill="#D6E2F2" font-size="14" text-anchor="middle">_do_retrieve</text>
  <text x="660" y="146" fill="#D6E2F2" font-size="13" text-anchor="middle">逐 query concat</text>
  <text x="660" y="166" fill="#FF9F45" font-size="13" text-anchor="middle">首分锁死(去重)</text>
  <text x="660" y="184" fill="#7E93B0" font-size="11" text-anchor="middle">锁住首次出现那条分数</text>

  <!-- box4 -->
  <rect x="290" y="262" width="230" height="74" rx="10" fill="#16263D" stroke="#3E6FB0" stroke-width="1.5"/>
  <text x="405" y="290" fill="#D6E2F2" font-size="14" text-anchor="middle">sort by score</text>
  <text x="405" y="312" fill="#FF9F45" font-size="13" text-anchor="middle">跨 query 混排</text>
  <text x="405" y="330" fill="#7E93B0" font-size="11" text-anchor="middle">不同 query 分数不可比</text>

  <!-- box5 -->
  <rect x="560" y="258" width="200" height="84" rx="10" fill="#3A1622" stroke="#FF5C7A" stroke-width="2"/>
  <text x="660" y="288" fill="#FF8FA3" font-size="14" text-anchor="middle">精确文档</text>
  <text x="660" y="318" fill="#FF5C7A" font-size="22" font-weight="bold" text-anchor="middle">rank 9 (被埋)</text>

  <!-- arrows -->
  <line x1="240" y1="143" x2="286" y2="146" stroke="#6E8DBF" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="520" y1="150" x2="556" y2="150" stroke="#6E8DBF" stroke-width="2" marker-end="url(#arw)"/>
  <path d="M660,190 C660,235 405,238 405,258" fill="none" stroke="#6E8DBF" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="520" y1="299" x2="556" y2="300" stroke="#6E8DBF" stroke-width="2" marker-end="url(#arw)"/>

  <!-- caption -->
  <rect x="40" y="378" width="720" height="56" rx="10" fill="#13233A" stroke="#2E4A6E" stroke-width="1"/>
  <text x="60" y="402" fill="#D6E2F2" font-size="14">日志实证：'基站信息格式' 是 audit.log 出现 <tspan fill="#FF9F45" font-weight="bold">9 次</tspan> 的最高频 query，</text>
  <text x="60" y="424" fill="#D6E2F2" font-size="14">却被朴素合并算法沉到第 <tspan fill="#FF5C7A" font-weight="bold">9</tspan> 名，精准文档浮不上来。</text>
</svg>
