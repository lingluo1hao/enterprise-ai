<svg width="680" height="200" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="680" height="200" fill="#ffffff"/>
  <text x="14" y="22" font-size="14" fill="#0f2942" font-weight="bold" font-family="sans-serif">原理对比：原流程 vs 嫁接后</text>
  <!-- 左：原流程 -->
  <rect x="20" y="40" width="300" height="140" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="170" y="64" font-size="13" fill="#991b1b" text-anchor="middle" font-family="sans-serif">原流程（每次重算）</text>
  <rect x="50" y="78" width="240" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="170" y="98" font-size="12" fill="#7f1d1d" text-anchor="middle" font-family="sans-serif">问题 → LLM改写 → 检索 → 生成</text>
  <text x="170" y="128" font-size="11" fill="#991b1b" text-anchor="middle" font-family="sans-serif">每个问题都过 LLM，费 token</text>
  <text x="170" y="146" font-size="11" fill="#991b1b" text-anchor="middle" font-family="sans-serif">结果不沉淀，下次照样重算</text>
  <!-- 右：嫁接后 -->
  <rect x="360" y="40" width="300" height="140" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="510" y="64" font-size="13" fill="#166534" text-anchor="middle" font-family="sans-serif">嫁接后（查表优先）</text>
  <rect x="390" y="78" width="240" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="510" y="98" font-size="12" fill="#14532d" text-anchor="middle" font-family="sans-serif">问题 → 查Playbook → 命中跳LLM</text>
  <text x="510" y="128" font-size="11" fill="#166534" text-anchor="middle" font-family="sans-serif">命中跳过改写，省 token</text>
  <text x="510" y="146" font-size="11" fill="#166534" text-anchor="middle" font-family="sans-serif">未命中仍LLM并回写经验</text>
</svg>