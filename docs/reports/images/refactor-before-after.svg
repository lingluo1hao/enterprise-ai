<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390">
  <rect width="760" height="390" fill="#f8fafc"/>
  <text x="380" y="26" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">改造前 vs 改造后（六维度）</text>
  <defs>
    <marker id="arba" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <!-- 表头 -->
  <text x="77" y="52" font-size="11" font-weight="700" text-anchor="middle" fill="#334155">维度</text>
  <text x="275" y="52" font-size="11" font-weight="700" text-anchor="middle" fill="#dc2626">改造前</text>
  <text x="585" y="52" font-size="11" font-weight="700" text-anchor="middle" fill="#059669">改造后</text>

  <!-- 行 1 -->
  <text x="77" y="80" font-size="10" font-weight="700" text-anchor="middle" fill="#0f172a">评测 Judge</text>
  <rect x="145" y="62" width="260" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="275" y="76" font-size="10" text-anchor="middle" fill="#334155">本地 1.5B 过松</text>
  <text x="275" y="90" font-size="10" text-anchor="middle" fill="#334155">幻觉判"相关"</text>
  <path d="M408,79 L424,79" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arba)"/>
  <rect x="430" y="62" width="310" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="585" y="76" font-size="10" text-anchor="middle" fill="#334155">DeepSeek 强 Judge</text>
  <text x="585" y="90" font-size="10" text-anchor="middle" fill="#334155">真幻觉打 0.0</text>

  <!-- 行 2 -->
  <text x="77" y="132" font-size="10" font-weight="700" text-anchor="middle" fill="#0f172a">难题生成</text>
  <rect x="145" y="114" width="260" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="275" y="128" font-size="10" text-anchor="middle" fill="#334155">一律 qwen2:7b</text>
  <text x="275" y="142" font-size="10" text-anchor="middle" fill="#334155">CPU 易幻觉</text>
  <path d="M408,131 L424,131" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arba)"/>
  <rect x="430" y="114" width="310" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="585" y="128" font-size="10" text-anchor="middle" fill="#334155">难度路由</text>
  <text x="585" y="142" font-size="10" text-anchor="middle" fill="#334155">硬 query 走 DeepSeek</text>

  <!-- 行 3 -->
  <text x="77" y="184" font-size="10" font-weight="700" text-anchor="middle" fill="#0f172a">测试判分</text>
  <rect x="145" y="166" width="260" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="275" y="180" font-size="10" text-anchor="middle" fill="#334155">无否定感知子串</text>
  <text x="275" y="194" font-size="10" text-anchor="middle" fill="#334155">窄拒答表→4 误判</text>
  <path d="M408,183 L424,183" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arba)"/>
  <rect x="430" y="166" width="310" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="585" y="180" font-size="10" text-anchor="middle" fill="#334155">分句否定感知</text>
  <text x="585" y="194" font-size="10" text-anchor="middle" fill="#334155">语义正则 误判消失</text>

  <!-- 行 4 -->
  <text x="77" y="236" font-size="10" font-weight="700" text-anchor="middle" fill="#0f172a">失败样本</text>
  <rect x="145" y="218" width="260" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="275" y="240" font-size="10" text-anchor="middle" fill="#334155">散落无库</text>
  <path d="M408,235 L424,235" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arba)"/>
  <rect x="430" y="218" width="310" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="585" y="232" font-size="10" text-anchor="middle" fill="#334155">bad_cases 表</text>
  <text x="585" y="246" font-size="10" text-anchor="middle" fill="#334155">管理页 + 点踩自动入</text>

  <!-- 行 5 -->
  <text x="77" y="288" font-size="10" font-weight="700" text-anchor="middle" fill="#0f172a">自进化</text>
  <rect x="145" y="270" width="260" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="275" y="292" font-size="10" text-anchor="middle" fill="#334155">无失败反向强化</text>
  <path d="M408,287 L424,287" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arba)"/>
  <rect x="430" y="270" width="310" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="585" y="284" font-size="10" text-anchor="middle" fill="#334155">三级信号</text>
  <text x="585" y="298" font-size="10" text-anchor="middle" fill="#334155">patch_success + 去重</text>

  <!-- 行 6 -->
  <text x="77" y="340" font-size="10" font-weight="700" text-anchor="middle" fill="#0f172a">reranker</text>
  <rect x="145" y="322" width="260" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="275" y="336" font-size="10" text-anchor="middle" fill="#334155">裸进程无守护</text>
  <text x="275" y="350" font-size="10" text-anchor="middle" fill="#334155">flaky 500</text>
  <path d="M408,339 L424,339" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arba)"/>
  <rect x="430" y="322" width="310" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="585" y="336" font-size="10" text-anchor="middle" fill="#334155">systemd + 看门狗</text>
  <text x="585" y="350" font-size="10" text-anchor="middle" fill="#334155">应用重试 三层防御</text>
</svg>
