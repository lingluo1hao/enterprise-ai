<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300">
  <rect width="760" height="300" fill="#f8fafc"/>
  <text x="380" y="24" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">reranker 三层防御（L1/L2/L3）</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <!-- 左：根因 -->
  <rect x="20" y="42" width="340" height="26" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="190" y="60" font-size="11" font-weight="700" text-anchor="middle" fill="#dc2626">根因（改造前）</text>

  <rect x="40" y="80" width="300" height="34" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="190" y="101" font-size="10" text-anchor="middle" fill="#334155">裸进程 llama-server 无 systemd 守护</text>
  <rect x="40" y="122" width="300" height="34" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="190" y="143" font-size="10" text-anchor="middle" fill="#334155">批大小 -b 2048 太小</text>

  <path d="M190,156 L190,176" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <rect x="110" y="178" width="160" height="34" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="190" y="199" font-size="10" font-weight="700" text-anchor="middle" fill="#dc2626">flaky 500</text>
  <path d="M270,195 L330,195 L330,250 L420,250" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <rect x="420" y="232" width="160" height="34" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <text x="500" y="253" font-size="10" text-anchor="middle" fill="#92400e">harness 回退 RRF</text>

  <!-- 右：三层防御 -->
  <rect x="400" y="42" width="340" height="26" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="570" y="60" font-size="11" font-weight="700" text-anchor="middle" fill="#059669">三层防御（改造后）</text>

  <rect x="420" y="80" width="320" height="40" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="580" y="98" font-size="10" font-weight="700" text-anchor="middle" fill="#334155">L1 systemd</text>
  <text x="580" y="113" font-size="9" text-anchor="middle" fill="#475569">Restart=always + -b 4096 -ub 4096 + MemoryMax=2G</text>

  <rect x="420" y="128" width="320" height="34" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="580" y="149" font-size="10" text-anchor="middle" fill="#334155">L2 cron 看门狗：每 30s 探活重启</text>

  <rect x="420" y="170" width="320" height="34" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="580" y="191" font-size="10" text-anchor="middle" fill="#334155">L3 应用端：5xx 重试 2 次 → 回退 RRF</text>

  <path d="M580,204 L580,228" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <rect x="420" y="230" width="320" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="580" y="248" font-size="10" font-weight="700" text-anchor="middle" fill="#065f46">reranker 常驻</text>
  <text x="580" y="263" font-size="10" text-anchor="middle" fill="#475569">精排生效 不回退</text>
</svg>
