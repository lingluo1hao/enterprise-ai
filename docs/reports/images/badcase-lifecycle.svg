  <rect x="470" y="48" width="190" height="40" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="565" y="73" font-size="11" text-anchor="middle" fill="#92400e">pipeline 异常</text>

  <path d="M115,88 L115,104 L340,104 L340,118" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arb)"/>
