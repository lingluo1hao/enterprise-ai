  <rect x="220" y="118" width="240" height="40" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="340" y="143" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">建 open bad case</text>

  <path d="M340,158 L340,180" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arb)"/>
  <rect x="220" y="180" width="240" height="40" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="340" y="197" font-size="10" text-anchor="middle" fill="#92400e">triage 根因</text>
  <text x="340" y="212" font-size="10" text-anchor="middle" fill="#475569">R1~R8 + 诊断 JSON</text>

  <path d="M340,220 L340,242" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arb)"/>
  <rect x="220" y="242" width="240" height="40" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="340" y="259" font-size="10" text-anchor="middle" fill="#92400e">修复</text>
  <text x="340" y="274" font-size="10" text-anchor="middle" fill="#475569">改 playbook / 调 prompt / 加黄金集</text>

  <path d="M340,282 L340,304" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arb)"/>
  <rect x="220" y="304" width="240" height="40" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="340" y="321" font-size="10" text-anchor="middle" fill="#92400e">标记 resolved</text>
  <text x="340" y="336" font-size="10" text-anchor="middle" fill="#475569">写 resolved_by / resolved_at</text>

  <path d="M460,324 L500,324 L500,200 L540,200" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#arb)"/>
