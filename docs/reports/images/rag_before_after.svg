<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>
  <text x="14" y="22" font-size="14" fill="#0f2942" font-weight="bold" font-family="sans-serif">图4 · 读路径搬家（BEFORE / AFTER）</text>
  <!-- BEFORE -->
  <rect x="20" y="40" width="300" height="240" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="170" y="64" font-size="13" fill="#991b1b" text-anchor="middle" font-family="sans-serif">BEFORE（当前·读死）</text>
  <rect x="50" y="80" width="240" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="170" y="102" font-size="12" fill="#7f1d1d" text-anchor="middle" font-family="sans-serif">cache.lookup(精确+语义)</text>
  <rect x="50" y="124" width="240" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="170" y="146" font-size="12" fill="#7f1d1d" text-anchor="middle" font-family="sans-serif">命中即 return → 管线不跑</text>
  <rect x="50" y="168" width="240" height="34" rx="6" fill="#fecaca" stroke="#dc2626" stroke-dasharray="5,4"/>
  <text x="170" y="190" font-size="12" fill="#7f1d1d" text-anchor="middle" font-family="sans-serif">Playbook 读（图内部）</text>
  <text x="170" y="224" font-size="11" fill="#991b1b" text-anchor="middle" font-family="sans-serif">→ 永远到不了</text>
  <text x="170" y="244" font-size="11" fill="#991b1b" text-anchor="middle" font-family="sans-serif">自进化 = 只写不读</text>
  <text x="170" y="264" font-size="11" fill="#991b1b" text-anchor="middle" font-family="sans-serif">（死缓存）</text>
  <!-- AFTER -->
  <rect x="360" y="40" width="300" height="240" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="510" y="64" font-size="13" fill="#166534" text-anchor="middle" font-family="sans-serif">AFTER（修正·读活）</text>
  <rect x="390" y="80" width="240" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="510" y="102" font-size="12" fill="#14532d" text-anchor="middle" font-family="sans-serif">① 精确缓存(version)</text>
  <rect x="390" y="124" width="240" height="34" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="510" y="146" font-size="12" fill="#14532d" text-anchor="middle" font-family="sans-serif">② Playbook读（顶层·缓存前）</text>
  <rect x="390" y="168" width="240" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="510" y="190" font-size="12" fill="#14532d" text-anchor="middle" font-family="sans-serif">③ 带prefill跑管线</text>
  <text x="510" y="224" font-size="11" fill="#166534" text-anchor="middle" font-family="sans-serif">→ 读路径活，闭环通</text>
  <text x="510" y="244" font-size="11" fill="#166534" text-anchor="middle" font-family="sans-serif">自进化 = 读写都通</text>
  <text x="510" y="264" font-size="11" fill="#166534" text-anchor="middle" font-family="sans-serif">（相似问题出新鲜答案）</text>
</svg>