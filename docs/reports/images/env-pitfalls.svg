<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330">
  <rect width="760" height="330" fill="#f8fafc"/>
  <text x="380" y="26" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">主线外踩坑地图（第七部分）</text>

  <!-- 1 VM 部署 -->
  <rect x="20" y="50" width="240" height="100" rx="8" fill="#ffffff" stroke="#d97706"/>
  <rect x="20" y="50" width="240" height="26" rx="8" fill="#fffbeb"/>
  <text x="140" y="68" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">VM 部署</text>
  <text x="32" y="92" font-size="9" fill="#334155">systemd 三连坑：</text>
  <text x="32" y="108" font-size="9" fill="#475569">路径错 / LD_LIBRARY_PATH</text>
  <text x="32" y="122" font-size="9" fill="#475569">漏 --host 0.0.0.0</text>
  <text x="32" y="138" font-size="9" fill="#475569">→ bash -lc 包装修</text>

  <!-- 2 Ollama -->
  <rect x="270" y="50" width="240" height="100" rx="8" fill="#ffffff" stroke="#d97706"/>
  <rect x="270" y="50" width="240" height="26" rx="8" fill="#fffbeb"/>
  <text x="390" y="68" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">Ollama</text>
  <text x="282" y="92" font-size="9" fill="#334155">num_ctx 默认 2048 静默截断</text>
  <text x="282" y="108" font-size="9" fill="#475569">（开头丢答案，无报错）</text>
  <text x="282" y="124" font-size="9" fill="#475569">bge-reranker 拉取需命名空间</text>
  <text x="282" y="140" font-size="9" fill="#475569">dengcao/bge-reranker-v2-m3</text>

  <!-- 3 内存 OOM -->
  <rect x="520" y="50" width="220" height="100" rx="8" fill="#ffffff" stroke="#d97706"/>
  <rect x="520" y="50" width="220" height="26" rx="8" fill="#fffbeb"/>
  <text x="630" y="68" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">内存 OOM</text>
  <text x="532" y="92" font-size="9" fill="#334155">7.5G 加载尖峰挤兑</text>
  <text x="532" y="108" font-size="9" fill="#475569">→ 加 4G swap</text>
  <text x="532" y="124" font-size="9" fill="#475569">→ OLLAMA_MAX_LOADED=1</text>
  <text x="532" y="140" font-size="9" fill="#475569">→ 预载 qwen + keep_alive</text>

  <!-- 4 网络 -->
  <rect x="20" y="165" width="240" height="90" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <rect x="20" y="165" width="240" height="26" rx="8" fill="#eff6ff"/>
  <text x="140" y="183" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a">网络</text>
  <text x="32" y="207" font-size="9" fill="#334155">VM 走 Clash Mixed 7897</text>
  <text x="32" y="223" font-size="9" fill="#475569">宿主 .1 非网关 .2</text>
  <text x="32" y="239" font-size="9" fill="#475569">四变量覆盖 http/https</text>

  <!-- 5 沙箱 -->
  <rect x="270" y="165" width="240" height="90" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <rect x="270" y="165" width="240" height="26" rx="8" fill="#eff6ff"/>
  <text x="390" y="183" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a">WorkBuddy 沙箱</text>
  <text x="282" y="207" font-size="9" fill="#334155">SAFE_DELETE 钩子</text>
  <text x="282" y="223" font-size="9" fill="#475569">Bash 里写 os.remove/rm</text>
  <text x="282" y="239" font-size="9" fill="#475569">→ fail-closed 短路</text>

  <!-- 6 网关 -->
  <rect x="520" y="165" width="220" height="90" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <rect x="520" y="165" width="220" height="26" rx="8" fill="#eff6ff"/>
  <text x="630" y="183" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a">网关 .env</text>
  <text x="532" y="207" font-size="9" fill="#334155">llm_gateway 不读 .env</text>
  <text x="532" y="223" font-size="9" fill="#475569">单独 import → 401 假象</text>
  <text x="532" y="239" font-size="9" fill="#475569">须 source .env 再跑</text>
</svg>
