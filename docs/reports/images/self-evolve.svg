<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410">
  <rect width="760" height="410" fill="#f8fafc"/>
  <text x="380" y="26" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">自进化闭环：三级信号 → patch_success + 去重 + 兜底</text>
  <defs>
    <marker id="arse" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <!-- 三级信号 -->
  <rect x="20" y="56" width="200" height="44" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="120" y="76" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a">L1 检索级</text>
  <text x="120" y="92" font-size="9" text-anchor="middle" fill="#475569">doc_grades 相关达标</text>

  <rect x="20" y="116" width="200" height="44" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="120" y="136" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a">L2 答案级</text>
  <text x="120" y="152" font-size="9" text-anchor="middle" fill="#475569">faithfulness(DS) 达标</text>

  <rect x="20" y="176" width="200" height="44" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="120" y="196" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a">L3 反馈级</text>
  <text x="120" y="212" font-size="9" text-anchor="middle" fill="#475569">rating=+1 赞 / -1 踩归零</text>

  <path d="M220,78 L262,78 L262,128 L270,128" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arse)"/>
  <path d="M220,138 L262,138 L262,132" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arse)"/>
  <path d="M220,198 L262,198 L262,128" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arse)"/>

  <rect x="270" y="104" width="240" height="48" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="390" y="124" font-size="10" font-weight="700" text-anchor="middle" fill="#0f172a">Extractor.evaluate_success</text>
  <text x="390" y="140" font-size="10" text-anchor="middle" fill="#475569">返回 (success, level)</text>

  <path d="M510,128 L540,128" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arse)"/>
  <rect x="540" y="104" width="200" height="48" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="640" y="124" font-size="10" font-weight="700" text-anchor="middle" fill="#065f46">patch_success(pk)</text>
  <text x="640" y="140" font-size="9" text-anchor="middle" fill="#475569">delete+insert success+1</text>

  <!-- 右侧机制 -->
  <rect x="540" y="176" width="200" height="56" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="552" y="196" font-size="10" font-weight="700" fill="#334155">save_or_merge</text>
  <text x="552" y="212" font-size="9" fill="#475569">相似问题复用计数</text>
  <text x="552" y="224" font-size="9" fill="#475569">不重复插 (MERGE_DIST)</text>

  <rect x="540" y="244" width="200" height="56" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="552" y="264" font-size="10" font-weight="700" fill="#334155">query_similar + _is_match</text>
  <text x="552" y="280" font-size="9" fill="#475569">文本相似度兜底</text>
  <text x="552" y="292" font-size="9" fill="#dc2626">Milvus 距离失真 → difflib≥0.92</text>

  <!-- 底部互馈 -->
  <path d="M390,152 L390,300 L120,300 L120,222" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#arse)"/>
  <text x="250" y="316" font-size="9" fill="#059669">失败样本反向强化</text>

  <rect x="300" y="338" width="440" height="50" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="520" y="358" font-size="10" font-weight="700" text-anchor="middle" fill="#065f46">与 Bad Case 互馈</text>
  <text x="520" y="374" font-size="9" text-anchor="middle" fill="#475569">open 案例 → triage 喂自进化 ｜ 强化后 playbook → 减少新 Bad Case</text>
</svg>
